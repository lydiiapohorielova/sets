
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Числові множини | Гейміфікація 🚀</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-page: #0f1015;
            --bg-panel: #161722;
            --bg-card: #1c1d29;
            --text-main: #e2e2e9;
            --text-muted: #8b8d9f;
            --accent-cyan: #00d2ff;
            --accent-purple-bg: #2d1b4e;
            --accent-purple-text: #b584f8;
            --btn-check: linear-gradient(90deg, #0eb582, #14c792);
            --btn-check-shadow: rgba(14, 181, 130, 0.4);
            --wrong: #ff4757;
            --correct: #2ed573;
            --border-color: #2a2b3d;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .app-container {
            background-color: var(--bg-panel);
            border-radius: 20px;
            border: 1px solid #232436;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            padding: 30px;
            max-width: 650px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 1.4em;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
        }

        .score-badge {
            background-color: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: var(--accent-cyan);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1);
        }

        .nav-label {
            font-size: 0.75em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(35px, 1fr));
            gap: 8px;
            margin-bottom: 30px;
        }

        .nav-item {
            aspect-ratio: 1;
            background-color: #1e1f2e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85em;
            color: var(--text-muted);
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            background-color: rgba(0, 210, 255, 0.05);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .nav-item.completed {
            background-color: rgba(46, 213, 115, 0.1);
            border-color: var(--correct);
            color: var(--correct);
        }

        .question-card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            background-color: var(--accent-purple-bg);
            color: var(--accent-purple-text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.15em;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #ffffff;
            min-height: 50px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #161722;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 16px;
            border-radius: 10px;
            font-size: 1em;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #3b3d56;
            background-color: #1a1b26;
        }

        .option-btn.selected {
            border-color: var(--accent-cyan);
            background-color: rgba(0, 210, 255, 0.05);
        }

        .option-btn.correct-ans {
            border-color: var(--correct);
            background-color: rgba(46, 213, 115, 0.1);
            color: var(--correct);
        }

        .option-btn.wrong-ans {
            border-color: var(--wrong);
            background-color: rgba(255, 71, 87, 0.1);
            color: var(--wrong);
        }

        .hint-box {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background-color: rgba(255, 165, 2, 0.1);
            border-left: 4px solid #ffa502;
            border-radius: 8px;
            color: #ffeed3;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-btn {
            background-color: #1e1f2e;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }

        .nav-btn:hover:not(:disabled) {
            color: #ffffff;
            border-color: #3b3d56;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .check-btn {
            background: var(--btn-check);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px var(--btn-check-shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px var(--btn-check-shadow);
        }
        
        .check-btn:disabled {
            background: #2a2b3d;
            color: #5a5c73;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .katex { font-size: 1.1em; }
        
        #finish-screen { display: none; text-align: center; padding: 40px 20px; }
        #finish-screen h2 { color: var(--accent-cyan); font-size: 2em; margin-bottom: 15px;}
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="quiz-content">
        <header class="header">
            <h1>🚀 Числові множини</h1>
            <div class="score-badge" id="score-display">Бали: 0 / 20</div>
        </header>

        <div class="nav-label">Навігація по завданнях:</div>
        <div class="nav-grid" id="nav-grid">
            </div>

        <div class="question-card">
            <div class="badge" id="block-badge">Блок 1 • Завдання 1 з 20</div>
            <div class="question-text" id="question-text">Завантаження...</div>
            
            <div class="options-list" id="options-container">
                </div>
            
            <div class="hint-box" id="hint-box"></div>
        </div>

        <footer class="footer">
            <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">← Назад</button>
            <button class="check-btn" id="check-btn" onclick="verifyAnswer()">Перевірити ✨</button>
            <button class="nav-btn" id="next-btn" onclick="nextQuestion()">Вперед →</button>
        </footer>
    </div>

    <div id="finish-screen">
        <h2>Ти машина! 🤖🔥</h2>
        <p style="color: var(--text-muted); font-size: 1.1em; line-height: 1.5; margin-bottom: 30px;">
            Усі рівні пройдено. НМТ тебе тепер точно не злякає.<br>
            Чудова робота!
        </p>
        <button class="check-btn" onclick="location.reload()">Пройти ще раз 🔄</button>
    </div>

</div>

<script>
    // Варіанти ретельно перемішані, щоб правильні індекси не повторювались часто
    const quizData = [
        { q: "До якої множини належить $\\frac{15}{3}$?", options: ["Цілих від'ємних", "Ірраціональних", "Натуральних", "Недодатних"], correct: 2, hint: "Поділи 15 на 3. Півтора кота не буває, а от рівно стільки — цілком!" },
        { q: "А як щодо числа $\\pi$?", options: ["Раціональні", "Цілі", "Ірраціональні", "Натуральні"], correct: 2, hint: "Цей нескінченний хаос після коми не можна записати звичайним дробом." },
        { q: "Ускладнюємо: $\\pi^2$", options: ["Раціональні", "Натуральні", "Дійсні від'ємні", "Ірраціональні"], correct: 3, hint: "Якщо хаос ($\\pi$) помножити на хаос ($\\pi$), порядок не з'явиться." },
        { q: "Що скажеш про $\\frac{\\pi}{6}$?", options: ["Ірраціональні", "Цілі", "Натуральні", "Раціональні"], correct: 0, hint: "Нескінченний неперіодичний дріб, поділений на 6, все одно 'некрасивий'." },
        { q: "До якої множини належить $\\sqrt[5]{7^0}$?", options: ["Цілих від'ємних", "Ірраціональних", "Дробових", "Натуральних"], correct: 3, hint: "Будь-яке число в нульовому степені — це 1. А корінь з неї..." },
        { q: "Обчисли та визнач множину: $\\sqrt{3^2 + 4^2}$", options: ["Натуральні", "Цілі від'ємні", "Ірраціональні", "Дробові"], correct: 0, hint: "Єгипетський трикутник! $9 + 16 = 25$, корінь з 25 — красиве число." },
        { q: "Визнач множину: $\\sqrt{16} - 5$", options: ["Натуральні", "Цілі", "Ірраціональні", "Невід'ємні"], correct: 1, hint: "Корінь з 16 — це 4. $4 - 5 = -1$. Це ціле, але з мінусом." },
        { q: "Що щодо $\\sin\\left(\\frac{\\pi}{6}\\right)$?", options: ["Натуральні", "Ірраціональні", "Раціональні", "Цілі"], correct: 2, hint: "Згадай таблицю: це просто $\\frac{1}{2}$ (звичайний дріб)." },
        { q: "Визнач множину для: $\\frac{-\\sqrt{25}}{-5}$", options: ["Натуральні", "Цілі від'ємні", "Ірраціональні", "Дробові"], correct: 0, hint: "Мінус на мінус дає плюс! 5 / 5 = 1." },
        { q: "Що вийде: $\\sqrt{2} \\cdot \\sqrt{8}$?", options: ["Натуральні", "Ірраціональні", "Від'ємні", "Дробові"], correct: 0, hint: "Зажени під один корінь. 2 на 8 = 16." },
        { q: "Хитрий вираз: $1 - \\frac{1}{3} \\cdot 3$", options: ["Натуральні", "Цілі", "Ірраціональні", "Додатні"], correct: 1, hint: "Множення перше! $\\frac{1}{3} \\cdot 3 = 1$. А $1 - 1 = 0$! Це ціле число." },
        { q: "Число $e^0$", options: ["Ірраціональні", "Від'ємні", "Натуральні", "Дробові"], correct: 2, hint: "Будь-яке страшне число в нульовому степені = 1." },
        { q: "До якої множини належить мішаний дріб $2\\frac{1}{3}$?", options: ["Цілі", "Натуральні", "Ірраціональні", "Раціональні"], correct: 3, hint: "Це точно не ціле число, але його легко записати у вигляді звичайного дробу $\\frac{7}{3}$." },
        { q: "Обчисли: $-1.5 \\cdot (-2)$", options: ["Цілі від'ємні", "Ірраціональні", "Натуральні", "Дробові"], correct: 2, hint: "Мінуси згорають. $1.5 \\cdot 2 = 3$." },
        { q: "Просто число $0$", options: ["Натуральні", "Цілі від'ємні", "Ірраціональні", "Цілі"], correct: 3, hint: "Нуль — межа. Не додатний, не від'ємний, але точно цілий." },
        { q: "Що вийде, якщо піднести корінь до квадрата: $(\\sqrt{3})^2$?", options: ["Натуральні", "Ірраціональні", "Цілі від'ємні", "Дробові"], correct: 0, hint: "Квадрат з'їдає корінь! Залишається просто трійка, якою можна рахувати котиків." },
        { q: "Число $1.25$", options: ["Цілі", "Ірраціональні", "Натуральні", "Раціональні"], correct: 3, hint: "Скінченний дріб. Легко записати як $\\frac{5}{4}$." },
        { q: "Яка множина у $\\cos\\left(\\frac{\\pi}{2}\\right)$?", options: ["Цілі", "Натуральні", "Ірраціональні", "Додатні"], correct: 0, hint: "Косинус 90 градусів = 0." },
        { q: "До якої множини належить вираз $\\sqrt{3} - 1$?", options: ["Натуральні", "Цілі", "Ірраціональні", "Раціональні"], correct: 2, hint: "Корінь з 3 не добувається. Якщо від хаосу відняти 1, він все одно залишиться хаосом." },
        { q: "Останнє: $-(-(-(-1)))$", options: ["Цілі від'ємні", "Натуральні", "Ірраціональні", "Дробові"], correct: 1, hint: "4 мінуси. Парна кількість завжди дає плюс (+1)." }
    ];

    let current = 0;
    let score = 0;
    let selectedOption = null;
    let answeredQuestions = new Array(quizData.length).fill(false);

    const navGrid = document.getElementById('nav-grid');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const hintBox = document.getElementById('hint-box');
    const blockBadge = document.getElementById('block-badge');
    const checkBtn = document.getElementById('check-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const scoreDisplay = document.getElementById('score-display');

    function initQuiz() {
        for (let i = 0; i < quizData.length; i++) {
            const div = document.createElement('div');
            div.className = 'nav-item';
            div.innerText = i + 1;
            div.onclick = () => { if(answeredQuestions[i] || i === current) goto(i); }
            navGrid.appendChild(div);
        }
        loadQuestion();
    }

    function renderMath() {
        renderMathInElement(document.getElementById('quiz-content'), {
            delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
            throwOnError: false
        });
    }

    function loadQuestion() {
        selectedOption = null;
        hintBox.style.display = 'none';
        const q = quizData[current];
        
        blockBadge.innerText = `Блок 1 • Завдання ${current + 1} з ${quizData.length}`;
        questionText.innerHTML = q.q;
        optionsContainer.innerHTML = '';

        q.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = opt;
            
            if (answeredQuestions[current]) {
                btn.disabled = true;
                if (index === q.correct) btn.classList.add('correct-ans');
            } else {
                btn.onclick = () => selectOption(index, btn);
            }
            optionsContainer.appendChild(btn);
        });

        checkBtn.disabled = answeredQuestions[current];
        checkBtn.innerText = answeredQuestions[current] ? "Виконано ✔" : "Перевірити ✨";
        
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === quizData.length - 1;

        updateNavUI();
        renderMath();
    }

    function selectOption(index, btnElem) {
        if (answeredQuestions[current]) return;
        selectedOption = index;
        checkBtn.disabled = false;
        
        Array.from(optionsContainer.children).forEach(btn => btn.classList.remove('selected'));
        btnElem.classList.add('selected');
    }

    // Запуск конфеті
    function triggerConfetti() {
        confetti({
            particleCount: 100,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#00d2ff', '#b584f8', '#2ed573']
        });
    }

    function verifyAnswer() {
        if (selectedOption === null || answeredQuestions[current]) return;
        
        const q = quizData[current];
        const buttons = Array.from(optionsContainer.children);
        
        if (selectedOption === q.correct) {
            buttons[selectedOption].classList.remove('selected');
            buttons[selectedOption].classList.add('correct-ans');
            score++;
            scoreDisplay.innerText = `Бали: ${score} / ${quizData.length}`;
            answeredQuestions[current] = true;
            checkBtn.innerText = "Виконано ✔";
            checkBtn.disabled = true;
            updateNavUI();
            
            triggerConfetti(); // Викликаємо салют
            
            setTimeout(() => {
                if (current < quizData.length - 1) nextQuestion();
                else showFinish();
            }, 1800); // Трохи збільшив час, щоб учень встиг насолодитися салютом
            
        } else {
            buttons[selectedOption].classList.remove('selected');
            buttons[selectedOption].classList.add('wrong-ans');
            hintBox.innerHTML = `💡 <b>Підказка:</b> ${q.hint}`;
            hintBox.style.display = 'block';
            renderMath();
            
            setTimeout(() => {
                buttons[selectedOption].classList.remove('wrong-ans');
            }, 1000);
            selectedOption = null;
        }
    }

    function updateNavUI() {
        const items = navGrid.children;
        for (let i = 0; i < items.length; i++) {
            items[i].className = 'nav-item';
            if (answeredQuestions[i]) items[i].classList.add('completed');
            if (i === current) items[i].classList.add('active');
        }
    }

    function nextQuestion() {
        if (current < quizData.length - 1) {
            current++;
            loadQuestion();
        }
    }

    function prevQuestion() {
        if (current > 0) {
            current--;
            loadQuestion();
        }
    }

    function goto(index) {
        current = index;
        loadQuestion();
    }

    function showFinish() {
        document.getElementById('quiz-content').style.display = 'none';
        document.getElementById('finish-screen').style.display = 'block';
        
        // Фінальний мега-салют
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 5,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#00d2ff', '#b584f8', '#2ed573']
            });
            confetti({
                particleCount: 5,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#00d2ff', '#b584f8', '#2ed573']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    window.onload = initQuiz;
</script>

</body>
</html>
